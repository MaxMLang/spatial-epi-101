name: Deploy Quarto site to Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      - name: Setup R cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.local/share/renv
            ~/.cache/R
          key: ${{ runner.os }}-renv-${{ hashFiles('**/renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-renv-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libproj-dev libgeos-dev libudunits2-dev libgdal-dev libproj-dev libgeos-dev libudunits2-dev

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/install@v1
        with:
          version: latest

      - name: Cache Quarto packages
        uses: actions/cache@v3
        with:
          path: ~/.local/share/quarto
          key: ${{ runner.os }}-quarto-${{ hashFiles('**/renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-quarto-

      - name: Restore R dependencies
        run: |
          R -e "renv::restore()"

      - name: Build site
        run: |
          quarto render

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 